[package]
name = "glyphfolio-editor-egui"
description = "Original egui native adapter and feasibility surface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
glyphfolio-editor-core.workspace = true
glyphfolio-editor-layout.workspace = true
glyphfolio-editor-markdown.workspace = true
egui = "=0.37.0"
accesskit = "=0.25.0"
unicode-segmentation = "=1.13.3"
arboard = { version = "=3.7.0", default-features = false, features = ["image-data"] }
serde = { version = "=1.0.229", features = ["derive"] }
toml_edit = { version = "=0.25.17", default-features = false, features = ["parse", "display", "serde"] }

[lints]
workspace = true
