[package]
name = "glyphfolio-editor-demo"
description = "Standalone native feasibility demo for glyphfolio-editor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
glyphfolio-editor-core.workspace = true
glyphfolio-editor-egui.workspace = true
glyphfolio-editor-host-example = { path = "../host-integration" }
eframe = { version = "=0.37.0", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "x11", "wayland"] }
image = { version = "=0.25.10", default-features = false, features = ["png"] }

[lints]
workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSApplication", "NSEvent", "NSGraphicsContext", "NSResponder", "NSWindow"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSString", "NSGeometry", "NSProcessInfo"] }
