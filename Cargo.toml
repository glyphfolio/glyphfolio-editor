[workspace]
members = [
    "crates/editor-core",
    "crates/editor-markdown",
    "crates/editor-layout",
    "crates/editor-egui",
    "examples/host-integration",
    "examples/standalone-egui",
    "tools/native-probe",
]
default-members = ["crates/editor-core", "examples/host-integration"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
glyphfolio-editor-core = { path = "crates/editor-core", version = "0.1.0" }
glyphfolio-editor-markdown = { path = "crates/editor-markdown", version = "0.1.0" }
glyphfolio-editor-layout = { path = "crates/editor-layout", version = "0.1.0" }
glyphfolio-editor-egui = { path = "crates/editor-egui", version = "0.1.0" }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
